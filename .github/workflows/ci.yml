name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      #agg draws the charts to files without opening any windows
      - name: Run tests.py
        run: python tests.py
        env:
          MPLBACKEND: Agg
